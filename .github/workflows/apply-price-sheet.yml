name: apply-price-sheet
on:
  push:
    branches: [main]
    paths: ['_apply/**']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scripted edits
        run: python3 _apply/apply.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch _apply
          git add -A
          git diff --cached --quiet || git commit -m "Apply approved 2026-10-01 price sheet (scripted site-wide edits)"
          git push
